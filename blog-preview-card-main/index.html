<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Frontend Mentor | Blog preview card</title>

  <link rel="icon" type="image/png" sizes="32x32"
        href="./assets/images/favicon-32x32.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@500;800&display=swap"
        rel="stylesheet">

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

  <!-- Custom styles for the original design details -->
  <link rel="stylesheet" href="./style.css">
</head>

<body class="d-flex flex-column min-vh-100">
  <main class="container flex-grow-1 d-flex align-items-center py-4">
    <div class="row w-100 justify-content-center">
      <div class="col-12 col-sm-10 col-md-8 col-lg-6 d-flex justify-content-center">
        <article class="card blog-card w-100 p-4">
          <img
            class="card-img-top article-image"
            src="./assets/images/illustration-article.svg"
            alt="Colorful abstract illustration"
          >

          <div class="card-body px-0 pt-4 pb-0">
            <span class="badge blog-category text-dark fw-bold px-3 py-2 mb-2">
              Learning
            </span>

            <p class="small mb-3">Published 21 Dec 2023</p>

            <h1 class="h4 fw-bold lh-sm mb-3">
              <a class="link-dark text-decoration-none blog-title-link" href="#">
                HTML &amp; CSS foundations
              </a>
            </h1>

            <p class="text-secondary lh-base mb-0">
              These languages are the backbone of every website, defining
              structure, content, and presentation.
            </p>

            <div class="d-flex align-items-center gap-2 mt-4 small fw-bold">
              <img
                src="./assets/images/image-avatar.webp"
                alt=""
                class="author-avatar rounded-circle"
              >
              <span>Greg Hooper</span>
            </div>
          </div>
        </article>
      </div>
    </div>
  </main>

  <footer class="text-center py-2 attribution">
    Challenge by
    <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>.
    Coded by <a href="#">Prasanthi Kola</a>.
  </footer>
</body>
</html>
